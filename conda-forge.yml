azure:
  free_disk_space: true
  settings_linux:
    swapfile_size: 8GiB
bot:
  abi_migration_branches:
  - 1.24.x
  - 1.23.x
  - 1.22.x
  automerge: true
build_platform:
  linux_ppc64le: linux_64
conda_build:
  pkg_format: '2'
conda_forge_output_validation: true
github:
  branch_name: main
  tooling_branch_name: main
provider:
  linux_aarch64: default
  osx_arm64: default
test: native
