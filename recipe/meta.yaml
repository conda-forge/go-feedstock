{% set name = "go" %}
{% set version = "1.27.2" %}

package:
  name: {{ name }}-{{ go_variant_str }}-split
  version: {{ version }}

source:
  - folder: go
    url: https://dl.google.com/{{ name }}/go{{ version }}.src.tar.gz
    sha256: 03495da2ba64894d40f5c4992e49454fa78b50690604ff92b6afff5081b76e62
    patches:
      # Please see patches/README.md for more details
      - patches/0001-Fix-cgo_fortran-test-setup-for-conda.patch
      - patches/0002-Add-CC-C-CPP-LD-FLAGS-to-script_test-extraEnvKeys.patch
      - patches/0003-Inherit-CGO_-environment-variables.patch
      - patches/0004-Add-conda-aware-default-values-for-GOPATH-and-GOBIN.patch
      - patches/0005-cmd-link-internal-ld-disable-testWindowsBuildmodeCSh.patch
      - patches/0006-Revert-cmd-link-enable-internal-linker-in-more-cases.patch
      - patches/0007-Mark-ftree-as-a-safe-compiler-flag.patch
      - patches/0008-Mark-merge-constants-as-a-safe-compiler-flag.patch
      - patches/0009-Mark-conda-s-linker-flags-as-safe-for-internal-link.patch

  # Update this with a release from https://go.dev/dl/
  - folder: go-bootstrap
    url: https://go.dev/dl/go{{ version }}.linux-arm64.tar.gz  # [linux and aarch64]
    sha256: 94f3e30b8e374bc285e7dadc11e0865726b9bc6e85b841ccceaabc0214c6b7c8  # [linux and aarch64]

    url: https://go.dev/dl/go{{ version }}.linux-amd64.tar.gz  # [linux and x86_64]
    sha256: ecbadb99091a3f46e31f5f934b068b1864eafa7995211b39eaddf76996045fe5  # [linux and x86_64]

    url: https://go.dev/dl/go{{ version }}.windows-amd64.zip  # [win64]
    sha256: 1314008898bd40df77af4b014f777f08873dbdfbcd3d92308728ee03304fe04f  # [win64]

    url: https://go.dev/dl/go{{ version }}.darwin-arm64.tar.gz  # [osx]
    sha256: 76812b213b1b2302c978d28fa52fa92d541704b9e7d9d5db8002c50e4018c4c5  # [osx]

    url: https://go.dev/dl/go{{ version }}.windows-arm64.zip  # [win and arm64]
    sha256: 5c4b294f23b558619ae8a4aa94d023e3bca03f52c8398bb41b9026002b0013de  # [win and arm64]

build:
  number: 0

outputs:
  - name: {{ name }}-{{ go_variant_str }}
    build:
      binary_relocation: false
      detect_binary_files_with_prefix: false
      force_ignore_keys:    # [win]
        - c_compiler        # [win]
        - cxx_compiler      # [win]
        - fortran_compiler  # [win]
      # test data links to these DSOs
    requirements:
      run:
        - {{ pin_subpackage(name, exact=true) }}
        - {{ stdlib('c') }}           # [unix and cgo]
        - {{ compiler('c') }}         # [unix and cgo]
        - {{ compiler('ucrt64_c') }}  # [win and x86_64 and cgo]
        - clangarm64-clang-toolchain_win-arm64  # [win and arm64 and cgo]
        - clangarm64-flang  # [win and arm64 and cgo]
    test:
      commands:
        - go help

  - name: {{ name }}
    script: {{ go_variant_str }}/build.sh   # [unix]
    script: {{ go_variant_str }}/build.bat  # [win]
    build:
      binary_relocation: false
      detect_binary_files_with_prefix: false
      missing_dso_whitelist:
        - "*/libc.so.6"                # [linux]
        - "*/libstdc++.so.6"           # [linux]
        - $RPATH/libc.so.6             # [linux]
        - $RPATH/libstdc++.so.6        # [linux]
        - $RPATH/libtiff.so.6          # [linux]
        - /usr/lib/libSystem.B.dylib   # [osx]
        - $SYSROOT\System32\winmm.dll  # [win]
      run_exports:                            # [unix and cgo]
        strong:                               # [unix and cgo]
          - __glibc >={{ c_stdlib_version }}  # [linux and cgo]
          - __osx >=12                        # [osx and cgo]
    requirements:
      build:
        - {{ stdlib("c") }}          # [unix and cgo]
        - {{ compiler('c') }}        # [unix and cgo]
        - {{ compiler('cxx') }}      # [unix and cgo]
        - {{ compiler('fortran') }}  # [unix and cgo]

        - {{ compiler('ucrt64_c') }}        # [win and x86_64 and cgo]
        - {{ compiler('ucrt64_cxx') }}      # [win and x86_64 and cgo]
        - {{ compiler('ucrt64_fortran') }}  # [win and x86_64]
        - clangarm64-clang-toolchain_win-arm64  # [win and arm64 and cgo]
        - clangarm64-flang  # [win and arm64 and cgo]
      run:
        - _go_select =={{ go_variant_ver }}={{ go_variant_str }}
      run_constrained:
        # TODO: Move to run section once conda/conda#9845 is fixed

        - {{ pin_compatible(compiler('c')) }}        # [unix and cgo]
        - {{ pin_compatible(compiler('cxx')) }}      # [unix and cgo]

        - {{ pin_compatible(compiler('ucrt64_c')) }}        # [win and x86_64]]
        - {{ pin_compatible(compiler('ucrt64_cxx')) }}      # [win and x86_64]]
        - clangarm64-clang-toolchain_win-arm64 >=22.1.8  # [win and arm64 and cgo]
        - clangarm64-flang >=22.1.8  # [win and arm64 and cgo]
    test:
      requires:
        - {{ compiler('c') }}        # [unix and cgo]
        - {{ compiler('ucrt64_c') }}  # [win and x86_64]]
        - clangarm64-clang-toolchain_win-arm64  # [win and arm64 and cgo]
        - clangarm64-flang  # [win and arm64 and cgo]
        - git  # [unix]
        - binutils  # [osx]
        - perl
      files:
        - {{ go_variant_str }}
      commands:
        - chmod +x {{ go_variant_str }}/test.sh      # [unix]
        - ./{{ go_variant_str }}/test.sh             # [unix]
        - {{ go_variant_str }}/test.bat              # [win]
    about:
      home: https://go.dev
      license: BSD-3-Clause
      license_family: BSD
      license_file: go/LICENSE
      summary: The Go Programming Language

about:
  home: https://go.dev
  license: BSD-3-Clause
  license_family: BSD
  license_file: go/LICENSE
  summary: The Go Programming Language ({{ go_variant_str }})
  description: |
    Go is expressive, concise, clean, and efficient. Its concurrency mechanisms
    make it easy to write programs that get the most out of multicore and
    networked machines, while its novel type system enables flexible and
    modular program construction. Go compiles quickly to machine code yet has
    the convenience of garbage collection and the power of run-time reflection.
    It's a fast, statically typed, compiled language that feels like a
    dynamically typed, interpreted language.
  doc_url: https://go.dev/doc
  dev_url: https://github.com/golang

extra:
  feedstock-name: go
  recipe-maintainers:
    - nehaljwani
    - scopatz
    - sodre
    - stuarteberg
    - xhochy
    - hmaarrfk