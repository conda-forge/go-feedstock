# We use go1.4 as our bootstrap compiler
go14_compiler:
  - go1.4-bootstrap

go_variant_str:
  - cgo
  - nocgo

# One-hot-encoding of the variant selection above
cgo:
  - true
  - false

#
# Tie the variables together
zip_keys:
  -
    - go_variant_str
    - cgo

c_stdlib_version:   # [linux]
  - "2.17"          # [linux]
