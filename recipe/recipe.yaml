schema_version: 1

context:
  version: "1.23.12"
  build: 2

recipe:
  name: go-${{ go_variant_str }}-split
  version: ${{ version }}

source:
  - url: https://dl.google.com/go/go${{ version }}.src.tar.gz
    sha256: e1cce9379a24e895714a412c7ddd157d2614d9edbe83a84449b6e1840b4f1226
    target_directory: go
    patches:
      # Please see patches/README.md for more details
      - patches/0001-Fix-cgo_fortran-test-setup-for-conda.patch
      - patches/0002-Add-CC-C-CPP-LD-FLAGS-to-script_test-extraEnvKeys.patch
      - patches/0003-Inherit-CGO_-environment-variables.patch
      - patches/0004-Add-conda-aware-default-values-for-GOPATH-and-GOBIN.patch
      - patches/0005-cmd-link-internal-ld-disable-testWindowsBuildmodeCSh.patch
      - patches/0006-Revert-cmd-link-enable-internal-linker-in-more-cases.patch
      - patches/0007-Mark-ftree-as-a-safe-compiler-flag.patch
      - patches/0008-runtime-testdata-fix-for-C23-nullptr-keyword.patch

  # Update this with a release from https://go.dev/dl/
  # linux-aarch64 and linux-ppc64le are cross-compiled from linux-64
  - if: build_platform == "linux-64"
    then:
      url: https://go.dev/dl/go${{ version }}.linux-amd64.tar.gz
      sha256: d3847fef834e9db11bf64e3fb34db9c04db14e068eeb064f49af747010454f90
      target_directory: go-bootstrap
  - if: build_platform == "win-64"
    then:
      url: https://go.dev/dl/go${{ version }}.windows-amd64.zip
      sha256: 07c35866cdd864b81bb6f1cfbf25ac7f87ddc3a976ede1bf5112acbb12dfe6dc
      target_directory: go-bootstrap
  # Both osx-64 and osx-arm64 use the amd64 bootstrap
  - if: build_platform == "osx-64" or build_platform == "osx-arm64"
    then:
      url: https://go.dev/dl/go${{ version }}.darwin-amd64.tar.gz
      sha256: 0f6efdc3ffc6f03b230016acca0aef43c229de022d0ff401e7aa4ad4862eca8e
      target_directory: go-bootstrap

build:
  number: ${{ build }}
  skip: linux and s390x

outputs:
  - package:
      name: go
    build:
      string: ${{ go_variant_str }}_h${{ hash }}_${{ build }}
      script:
        file: ${{ go_variant_str }}/build
      dynamic_linking:
        binary_relocation: false
      prefix_detection:
        ignore_binary_files: true
    requirements:
      build:
        - if: unix and cgo
          then:
            - ${{ compiler('c') }}
            - ${{ stdlib("c") }}
            - ${{ compiler('cxx') }}
            - ${{ compiler('fortran') }}
        - if: win and cgo
          then:
            - ${{ compiler('m2w64_c') }}
            - ${{ stdlib("m2w64_c") }}
            - ${{ compiler('m2w64_cxx') }}
            - ${{ compiler('m2w64_fortran') }}
      run_constraints:
        # TODO: remove on next go version (>1.27.1), this is just to not accidentally select the wrong activation script
        - _go_select <0.0a0
        # https://github.com/prefix-dev/rattler-build/issues/2792
        - if: unix and cgo
          then:
            - ${{ compiler('c') }}
            - ${{ compiler('cxx') }}
            - ${{ compiler('fortran') }}
        - if: win and cgo
          then:
            - ${{ compiler('m2w64_c') }}
            - ${{ compiler('m2w64_cxx') }}
            - ${{ compiler('m2w64_fortran') }}
      run_exports:
        strong:
          - if: linux and x86_64 and cgo
            then: __glibc >=2.17
    tests:
      - files:
          recipe:
            - ${{ go_variant_str }}/
        requirements:
          run:
            - if: unix and cgo
              then: ${{ compiler('c') }}
            - if: win and cgo
              then: ${{ compiler('m2w64_c') }}
            - if: linux
              then: git
            - perl
        script:
          # telemetry counter files are written asynchronously into $HOME, which
          # races with the test directory cleanup
          - go telemetry off
          - if: unix
            then:
              - chmod +x ${{ go_variant_str }}/test.sh
              - ./${{ go_variant_str }}/test.sh
              - test "$GOTOOLCHAIN" = "local"
          - if: win
            then:
              - ${{ go_variant_str }}\test.bat
              - if not "%GOTOOLCHAIN%"=="local" exit /b 1
    about:
      homepage: https://go.dev/
      license: BSD-3-Clause
      license_file: go/LICENSE
      summary: The Go Programming Language

  - package:
      name: go-${{ go_variant_str }}
    build:
      dynamic_linking:
        binary_relocation: false
        # test data links to these DSOs
        missing_dso_allowlist:
          - if: linux and not cgo
            then: $RPATH/libc.so.6
          - if: osx
            then: /usr/lib/libSystem.B.dylib
          - if: win
            then: $SYSROOT\System32\winmm.dll
      prefix_detection:
        ignore_binary_files: true
    requirements:
      run:
        - ${{ pin_subpackage('go', exact=True) }}
        - if: unix and cgo
          then: ${{ compiler('c') }}
        - if: win and cgo
          then: ${{ compiler('m2w64_c') }}
    tests:
      - script:
          # telemetry counter files are written asynchronously into $HOME, which
          # races with the test directory cleanup
          - go telemetry off
          - go help

about:
  homepage: https://go.dev/
  license: BSD-3-Clause
  license_file: go/LICENSE
  summary: The Go Programming Language (${{ go_variant_str }})
  description: |
    Go is expressive, concise, clean, and efficient. Its concurrency mechanisms
    make it easy to write programs that get the most out of multicore and
    networked machines, while its novel type system enables flexible and
    modular program construction. Go compiles quickly to machine code yet has
    the convenience of garbage collection and the power of run-time reflection.
    It's a fast, statically typed, compiled language that feels like a
    dynamically typed, interpreted language.
  documentation: https://go.dev/doc
  repository: https://github.com/golang/

extra:
  feedstock-name: go
  recipe-maintainers:
    - nehaljwani
    - scopatz
    - sodre
    - stuarteberg
    - xhochy
    - hmaarrfk
