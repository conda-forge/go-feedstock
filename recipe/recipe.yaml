schema_version: 1

context:
  version: "1.27.3"
  build: 1

recipe:
  name: go-${{ go_variant_str }}-split
  version: ${{ version }}

source:
  - url: https://dl.google.com/go/go${{ version }}.src.tar.gz
    sha256: 6e7749035cf360f06b2575d162ea79df9fda8ef671889e5c375f8e50777f26bb
    target_directory: go
    patches:
      # Please see patches/README.md for more details
      - patches/0001-Fix-cgo_fortran-test-setup-for-conda.patch
      - patches/0002-Add-CC-C-CPP-LD-FLAGS-to-script_test-extraEnvKeys.patch
      - patches/0003-Inherit-CGO_-environment-variables.patch
      - patches/0004-Add-conda-aware-default-values-for-GOPATH-and-GOBIN.patch
      - patches/0005-cmd-link-internal-ld-disable-testWindowsBuildmodeCSh.patch
      - patches/0006-Revert-cmd-link-enable-internal-linker-in-more-cases.patch
      - patches/0007-Mark-ftree-as-a-safe-compiler-flag.patch
      - patches/0008-Mark-merge-constants-as-a-safe-compiler-flag.patch
      - patches/0009-Mark-conda-s-linker-flags-as-safe-for-internal-link.patch
      - patches/0010-Support-conda-s-Windows-ARM64-CGo-toolchain.patch
      - patches/0011-Fix-cgo-complex-test-for-Windows-Clang.patch
      - patches/0012-Support-CGo-tests-with-Windows-Clang.patch
      - patches/0013-Fix-MSVC-BadSymbol-fixture.patch
      - patches/0014-Fix-MSVC-response-file-probe.patch
      - patches/0016-Keep-linker-marker-out-of-CGo-probe.patch
      - patches/0017-Initialize-MSVC-Go-DLLs.patch
      - patches/0019-Support-MSVC-external-linker-options.patch
      - patches/0020-Support-MSVC-CGo-variables-and-fixtures.patch
      - patches/0021-Fix-CGo-flag-and-archive-validation.patch
      - patches/0022-Preserve-CGo-imports-and-fix-Windows-test-setup.patch
      - patches/0025-Avoid-C-global-address-wrapper-shadowing.patch
      - patches/0027-Scope-MSVC-CGo-test-capabilities.patch

  # Update this with a release from https://go.dev/dl/
  - if: build_platform == "linux-64"
    then:
      url: https://go.dev/dl/go${{ version }}.linux-amd64.tar.gz
      sha256: 65efbc80fdc1fa2cd2631cad5b481777a68e8725f34e89f50fc6ac714e379b40
      target_directory: go-bootstrap
  - if: build_platform == "linux-aarch64"
    then:
      url: https://go.dev/dl/go${{ version }}.linux-arm64.tar.gz
      sha256: a06e99309dbcbdca1a8ccd2282c3ee146e55930886e26b4f1193269587165f49
      target_directory: go-bootstrap
  - if: build_platform == "win-64"
    then:
      url: https://go.dev/dl/go${{ version }}.windows-amd64.zip
      sha256: f26081f438319757f8a1b46d7d0b2c5ec7583d4038e485e0aa725cfde7885fff
      target_directory: go-bootstrap
  - if: build_platform == "win-arm64"
    then:
      url: https://go.dev/dl/go${{ version }}.windows-arm64.zip
      sha256: c507872ff21f8a7cd3c1c217b059c6f7271a4a9d8e692810ef9dd3e1f601197c
      target_directory: go-bootstrap
  - if: build_platform == "osx-64"
    then:
      url: https://go.dev/dl/go${{ version }}.darwin-amd64.tar.gz
      sha256: b6f8e931e4ab497fcde6da8ae4499a58f9d258e55c8a80824a516eae5950a750
      target_directory: go-bootstrap
  - if: build_platform == "osx-arm64"
    then:
      url: https://go.dev/dl/go${{ version }}.darwin-arm64.tar.gz
      sha256: dd3908cf20959d798c1e06ebe5b72213f0505ce01373b40ce3110975a6cd99c2
      target_directory: go-bootstrap

build:
  number: ${{ build }}

outputs:
  - package:
      name: go
    build:
      string: ${{ go_variant_str }}_h${{ hash }}_${{ build }}
      script:
        file: ${{ go_variant_str }}/build
      dynamic_linking:
        binary_relocation: false
      prefix_detection:
        ignore_binary_files: true
    requirements:
      build:
        - if: unix and cgo
          then:
            - ${{ compiler('c') }}
            - ${{ stdlib("c") }}
            - ${{ compiler('cxx') }}
            - ${{ compiler('fortran') }}
        - if: target_platform == "win-64" and cgo
          then:
            - ${{ compiler('m2w64_c') }}
            - ${{ stdlib("m2w64_c") }}
            - ${{ compiler('m2w64_cxx') }}
            - ${{ compiler('m2w64_fortran') }}
        - if: target_platform == "win-arm64" and cgo
          then:
            - ${{ compiler('c') }}
            - ${{ stdlib("c") }}
      run_constraints:
        # https://github.com/prefix-dev/rattler-build/issues/2792
        - if: unix and cgo
          then:
            - ${{ compiler('c') }}
            - ${{ compiler('cxx') }}
            - ${{ compiler('fortran') }}
        - if: target_platform == "win-64" and cgo
          then:
            - ${{ compiler('m2w64_c') }}
            - ${{ compiler('m2w64_cxx') }}
            - ${{ compiler('m2w64_fortran') }}
        - if: target_platform == "win-arm64" and cgo
          then: ${{ compiler('c') }}
      run_exports:
        strong:
          - if: linux and cgo
            then: __glibc >=${{ c_stdlib_version }}
          - if: osx and cgo
            then: __osx >=12
    tests:
      - files:
          recipe:
            - ${{ go_variant_str }}/
            - windows/
        requirements:
          run:
            - if: unix and cgo
              then: ${{ compiler('c') }}
            - if: target_platform == "win-64" and cgo
              then: ${{ compiler('m2w64_c') }}
            - if: target_platform == "win-arm64" and cgo
              then: ${{ compiler('c') }}
        script:
          # Read runner flags when testing, not when rendering the package.
          secrets:
            - GITHUB_ACTIONS
            - RUNNER_ENVIRONMENT
          content:
            # telemetry counter files are written asynchronously into $HOME, which
            # races with the test directory cleanup
            - go telemetry off
            - if: unix
              then:
                - ./${{ go_variant_str }}/test.sh
                # etc/conda/env_vars.d/go.json is activated and its baked-in build
                # prefix was rewritten to the installation prefix
                - test "$GOTOOLCHAIN" = "local"
                - test "$GOROOT" = "$CONDA_PREFIX/go"
                - test "$(go env GOROOT)" = "$CONDA_PREFIX/go"
            - if: win
              then:
                - call ${{ go_variant_str }}\test.bat
                # etc/conda/env_vars.d/go.json is activated and its baked-in build
                # prefix was rewritten to the installation prefix. The JSON stores
                # forward slashes, so compare slash-insensitively.
                - if not "%GOTOOLCHAIN%"=="local" exit /b 1
                - 'if not "%GOROOT:\=/%"=="%CONDA_PREFIX:\=/%/go" exit /b 1'
                - 'for /f "delims=" %%i in (''go env GOROOT'') do set "GO_GOROOT=%%i"'
                - 'if not "%GO_GOROOT:\=/%"=="%CONDA_PREFIX:\=/%/go" exit /b 1'
    about:
      homepage: https://go.dev/
      license: BSD-3-Clause
      license_file: go/LICENSE
      summary: The Go Programming Language

  # meta-package for non-feedstock use
  - package:
      name: go-${{ go_variant_str }}
    requirements:
      run:
        - ${{ pin_subpackage('go', exact=true) }}
        - if: unix and cgo
          then: ${{ compiler('c') }}
        - if: target_platform == "win-64" and cgo
          then: ${{ compiler('m2w64_c') }}
        - if: target_platform == "win-arm64" and cgo
          then: ${{ compiler('c') }}
    tests:
      - script:
          # telemetry counter files are written asynchronously into $HOME, which
          # races with the test directory cleanup
          - go telemetry off
          - go help

about:
  homepage: https://go.dev
  license: BSD-3-Clause
  license_file: go/LICENSE
  summary: The Go Programming Language (${{ go_variant_str }})
  description: |
    Go is expressive, concise, clean, and efficient. Its concurrency mechanisms
    make it easy to write programs that get the most out of multicore and
    networked machines, while its novel type system enables flexible and
    modular program construction. Go compiles quickly to machine code yet has
    the convenience of garbage collection and the power of run-time reflection.
    It's a fast, statically typed, compiled language that feels like a
    dynamically typed, interpreted language.
  documentation: https://go.dev/doc
  repository: https://github.com/golang/go

extra:
  feedstock-name: go
  recipe-maintainers:
    - pavelzw
    - nehaljwani
    - scopatz
    - sodre
    - stuarteberg
    - xhochy
    - hmaarrfk
